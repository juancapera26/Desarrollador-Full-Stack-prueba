<ion-content [fullscreen]="true">
  <main class="register-shell">
    <section class="register-card" aria-labelledby="login-title">
      <img class="brand-logo" src="assets/images/logo.svg" alt="Logo de Comercio" />
      <p class="eyebrow">COMERCIO</p>
      <h1 id="login-title">Inicia sesi&#243;n</h1>
      <p class="intro">Ingresa tus credenciales para continuar con tu compra.</p>

      <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
        <ion-item lines="none" [class.invalid]="hasError('email')">
          <ion-input label="Correo electr&#243;nico" labelPlacement="stacked" formControlName="email" type="email" autocomplete="email" placeholder="tu@correo.com" />
        </ion-item>
        <ion-note color="danger" *ngIf="hasError('email')">Ingresa un correo v&#225;lido.</ion-note>

        <ion-item lines="none" [class.invalid]="hasError('password')">
          <ion-input label="Contrase&#241;a" labelPlacement="stacked" formControlName="password" type="password" autocomplete="current-password" placeholder="Tu contrase&#241;a" />
        </ion-item>
        <ion-note color="danger" *ngIf="hasError('password')">Ingresa tu contrase&#241;a.</ion-note>

        <ion-text color="danger" *ngIf="errorMessage"><p class="form-message" role="alert">{{ errorMessage }}</p></ion-text>
        <ion-button expand="block" type="submit" [disabled]="submitting">{{ submitting ? 'Ingresando...' : 'Ingresar' }}</ion-button>
      </form>

      <p class="login-hint">&#191;No tienes cuenta? <a routerLink="/register">Reg&#237;strate</a>.</p>
    </section>
  </main>
</ion-content>
